# Builds every installer and publishes them to the PUBLIC releases repo
# (mo7ammed3adel/downly-releases) — this source repo stays private.
#
# Trigger: push a tag like v1.0.1   (git tag v1.0.1 && git push --tags)
#          or run it by hand from the Actions tab.
# Needs secret RELEASES_TOKEN: a token that can create releases in downly-releases.
# Optional AMO_JWT_ISSUER + AMO_JWT_SECRET (addons.mozilla.org API key): signs the Firefox
# extension so it installs permanently. Without them Firefox only gets a temporary add-on.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to publish (e.g. v1.0.0)'
        required: true

permissions:
  contents: read

env:
  TAG: ${{ github.event.inputs.version || github.ref_name }}
  RELEASES_REPO: mo7ammed3adel/downly-releases

jobs:
  # Firefox only installs extensions Mozilla has signed. Signed once here, then bundled
  # into every installer (one-click install from the app) and published for the website.
  firefox:
    runs-on: ubuntu-latest
    env:
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
      GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        if: env.AMO_JWT_ISSUER != ''

      - uses: actions/setup-node@v4
        if: env.AMO_JWT_ISSUER != ''
        with:
          node-version: 22

      - name: Sign the Firefox extension
        if: env.AMO_JWT_ISSUER != ''
        # A failed signing must not block the desktop release
        continue-on-error: true
        run: |
          mkdir -p signed
          # Mozilla refuses to sign the same version twice: reuse it when re-running a tag
          if gh release download "$TAG" --repo "$RELEASES_REPO" -p Downly-firefox.xpi -O signed/downly-firefox.xpi; then
            exit 0
          fi
          node -e "
            const f = 'extension/manifest.json', m = require('./' + f)
            m.version = process.env.TAG.replace(/^v/, '')
            m.background = { scripts: ['i18n.js', 'background.js'] }
            require('fs').writeFileSync(f, JSON.stringify(m, null, 2))
          "
          npx -y web-ext@8 sign --source-dir extension --artifacts-dir web-ext-artifacts             --channel unlisted --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET"
          mv web-ext-artifacts/*.xpi signed/downly-firefox.xpi

      - uses: actions/upload-artifact@v4
        with:
          name: firefox-xpi
          path: signed/downly-firefox.xpi
          if-no-files-found: ignore

  build:
    needs: firefox
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: win }
          - { os: windows-latest, target: win7 }
          - { os: macos-latest, target: mac }
          - { os: ubuntu-latest, target: linux }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - uses: actions/download-artifact@v4
        # Absent when signing was skipped: the app then falls back to a temporary add-on
        continue-on-error: true
        with:
          name: firefox-xpi
          path: resources

      - name: Build installers
        run: node scripts/dist.mjs ${{ matrix.target }}
        env:
          # No code-signing certificates yet: build unsigned
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.target }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Pack the browser extension
        run: |
          if [ -f dist/downly-firefox.xpi ]; then mv dist/downly-firefox.xpi dist/Downly-firefox.xpi; fi
          cd extension && zip -qr ../dist/Downly-extension.zip . && cd ..
          ls -la dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          NOTES="Download the installer for your system from https://downly-app.vercel.app"
          if gh release view "$TAG" --repo "$RELEASES_REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$RELEASES_REPO" --clobber
          else
            gh release create "$TAG" dist/* --repo "$RELEASES_REPO" --title "Downly $TAG" --notes "$NOTES" --latest
          fi
